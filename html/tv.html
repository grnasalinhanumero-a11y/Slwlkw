<!DOCTYPE html>
<html lang="pt-br" class="dark h-full antialiased scroll-smooth">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <title>Iracemaflix - Assistir TV</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lead: '#348cfe',
                        'dark-bg': 'rgb(5,5,5)'
                    }
                }
            }
        }
    </script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: #050505;
            color: #fff;
        }

        .player-aspect {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }

        .player-aspect iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .btn-player {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .btn-player.active {
            background: #348cfe;
            border-color: #348cfe;
            box-shadow: 0 0 15px rgba(52,140,254,0.4);
        }

        .btn-player:hover:not(.active) {
            background: rgba(255,255,255,0.1);
        }


        /* =========================================================
           GUIA DE PROGRAMAÇÃO
        ========================================================= */

        .tv-guide {
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
        }

        .tv-guide-header {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .tv-guide-title {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .12em;
        }

        .tv-guide-title i {
            color: #348cfe;
        }


        /* =========================================================
           PROGRAMA ATUAL
        ========================================================= */

        .tv-guide-now {
            padding: 18px 20px;
            background: rgba(52,140,254,.07);
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .tv-guide-now-label {
            display: flex;
            align-items: center;
            gap: 7px;

            color: #348cfe;

            font-size: 8px;
            font-weight: 900;
            letter-spacing: .12em;
            text-transform: uppercase;

            margin-bottom: 7px;
        }

        .tv-guide-live-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #348cfe;

            box-shadow: 0 0 10px rgba(52,140,254,.8);

            animation: tvGuidePulse 1.5s infinite;
        }

        @keyframes tvGuidePulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .35;
            }
        }

        .tv-guide-current-name {
            font-size: 15px;
            font-weight: 900;
            line-height: 1.3;
        }

        .tv-guide-current-time {
            margin-top: 5px;

            color: rgba(255,255,255,.45);

            font-size: 9px;
            font-weight: 700;
        }

        .tv-guide-progress {
            width: 100%;
            height: 4px;

            margin-top: 12px;

            background: rgba(255,255,255,.1);

            border-radius: 10px;
            overflow: hidden;
        }

        .tv-guide-progress-fill {
            height: 100%;

            background: #348cfe;

            border-radius: 10px;

            transition: width .4s ease;
        }


        /* =========================================================
           LISTA DE PROGRAMAS
        ========================================================= */

        .tv-guide-list {
            max-height: 430px;
            overflow-y: auto;
        }

        .tv-guide-list::-webkit-scrollbar {
            width: 4px;
        }

        .tv-guide-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.15);
            border-radius: 10px;
        }

        .tv-guide-item {
            display: grid;

            grid-template-columns: 70px 1fr;

            gap: 12px;

            padding: 14px 20px;

            border-bottom: 1px solid rgba(255,255,255,.05);

            transition: .2s;
        }

        .tv-guide-item:last-child {
            border-bottom: none;
        }

        .tv-guide-item:hover {
            background: rgba(255,255,255,.04);
        }

        .tv-guide-item.active {
            background: rgba(52,140,254,.08);
        }

        .tv-guide-time {
            font-size: 9px;
            font-weight: 800;

            color: rgba(255,255,255,.35);

            padding-top: 2px;
        }

        .tv-guide-item.active .tv-guide-time {
            color: #348cfe;
        }

        .tv-guide-program {
            min-width: 0;
        }

        .tv-guide-program-name {
            font-size: 10px;
            font-weight: 800;

            color: rgba(255,255,255,.75);

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tv-guide-item.active .tv-guide-program-name {
            color: #fff;
        }

        .tv-guide-program-end {
            margin-top: 3px;

            font-size: 8px;

            color: rgba(255,255,255,.25);
        }

        .tv-guide-empty {
            padding: 25px 20px;

            text-align: center;

            color: rgba(255,255,255,.25);

            font-size: 9px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: .08em;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media(max-width: 500px) {

            .tv-guide-header {
                padding: 15px;
            }

            .tv-guide-now {
                padding: 15px;
            }

            .tv-guide-item {
                grid-template-columns: 58px 1fr;

                padding: 13px 15px;

                gap: 9px;
            }

            .tv-guide-current-name {
                font-size: 13px;
            }

            .tv-guide-list {
                max-height: 380px;
            }
        }
    </style>
</head>


<body class="bg-[#050505] min-h-screen pb-10">


<!-- ============================================================
     HEADER
============================================================ -->

<header class="bg-[rgb(5,5,5)] border-b border-white/5 sticky top-0 z-50">

    <div class="container xl:max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

        <div class="flex items-center gap-4">

            <a
                href="javascript:history.back()"
                class="bg-white/5 w-10 h-10 rounded-full flex items-center justify-center hover:bg-lead transition-all"
            >
                <i class="fas fa-arrow-left"></i>
            </a>

            <h1
                id="tvTitle"
                class="font-black text-sm uppercase tracking-widest truncate max-w-[200px] md:max-w-md"
            >
                Carregando...
            </h1>

        </div>

        <a
            href="/"
            class="block font-black text-xl tracking-tighter uppercase text-white"
        >
            Iracema<span class="text-lead">flix</span>
        </a>

    </div>

</header>



<!-- ============================================================
     MAIN
============================================================ -->

<main class="container xl:max-w-7xl mx-auto px-4 mt-6">

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">


        <!-- ====================================================
             PLAYER
        ===================================================== -->

        <div class="lg:col-span-2 space-y-6">

            <div
                id="playerWrapper"
                class="player-aspect rounded-2xl overflow-hidden shadow-2xl ring-1 ring-white/10"
            >

                <div
                    id="loading"
                    class="absolute inset-0 flex flex-col items-center justify-center gap-4 z-10 bg-black"
                >

                    <div
                        class="w-12 h-12 border-4 border-lead border-t-transparent rounded-full animate-spin"
                    ></div>

                    <p class="text-[10px] font-black uppercase tracking-[0.3em] text-white/40">
                        Conectando ao sinal...
                    </p>

                </div>

                <div
                    id="iframeContainer"
                    class="w-full h-full hidden"
                ></div>

            </div>



            <!-- =================================================
                 PLAYERS
            ================================================== -->

            <div
                id="playerSelector"
                class="hidden space-y-4"
            >

                <h3
                    class="text-[10px] font-black uppercase tracking-widest text-white/40 flex items-center gap-2"
                >
                    <i class="fas fa-play-circle text-lead"></i>

                    Escolha um Player
                </h3>

                <div
                    id="playerButtons"
                    class="flex flex-wrap gap-3"
                ></div>

            </div>

        </div>



        <!-- ====================================================
             INFORMAÇÕES
        ===================================================== -->

        <div class="space-y-6">


            <!-- =================================================
                 INFO CARD
            ================================================== -->

            <div
                id="infoCard"
                class="bg-white/5 border border-white/10 rounded-2xl p-6 space-y-6 hidden"
            >

                <div
                    id="itemPoster"
                    class="aspect-video rounded-xl overflow-hidden bg-white/5 shadow-lg ring-1 ring-white/10"
                >

                    <img
                        src=""
                        alt=""
                        class="w-full h-full object-cover"
                    >

                </div>


                <div class="space-y-4">

                    <div>

                        <h2
                            id="itemName"
                            class="text-xl font-black uppercase tracking-tight leading-tight"
                        ></h2>

                        <p
                            id="itemCategory"
                            class="text-lead text-[10px] font-black uppercase tracking-widest mt-1"
                        ></p>

                    </div>


                    <div
                        id="itemDetails"
                        class="space-y-3 text-sm text-white/60"
                    ></div>

                </div>

            </div>



            <!-- =================================================
                 GUIA DE PROGRAMAÇÃO
            ================================================== -->

            <div
                id="tvGuide"
                class="tv-guide hidden"
            >

                <div class="tv-guide-header">

                    <div class="tv-guide-title">

                        <i class="fas fa-calendar-alt"></i>

                        Guia de programação

                    </div>

                </div>


                <!-- Programa atual -->

                <div id="tvGuideNow"></div>


                <!-- Lista completa -->

                <div
                    id="tvGuideList"
                    class="tv-guide-list"
                ></div>

            </div>



            <!-- =================================================
                 DICA
            ================================================== -->

            <div class="bg-lead/10 border border-lead/20 rounded-2xl p-6">

                <h4
                    class="text-xs font-black uppercase tracking-widest text-lead mb-2"
                >
                    Dica de Transmissão
                </h4>

                <p class="text-xs text-white/60 leading-relaxed">

                    Se o player travar ou não carregar,
                    tente trocar para outro servidor nos botões ao lado.

                    Recomendamos conexão Wi-Fi para melhor estabilidade.

                </p>

            </div>

        </div>

    </div>

</main>



<script>

    /* ============================================================
       APIS
    ============================================================ */

    const REI_API_CHANNELS =
        'https://reidosembeds.online/api/channels';

    const REI_API_EVENTS =
        'https://reidosembeds.online/api/eventos';



    /* ============================================================
       URL
    ============================================================ */

    const urlParams =
        new URLSearchParams(window.location.search);

    const id =
        urlParams.get('id');

    const type =
        urlParams.get('type');



    /* ============================================================
       VERIFICAR URL
    ============================================================ */

    if (!id || !type) {

        window.location.href = '/';

    }



    /* ============================================================
       ESCAPAR HTML
    ============================================================ */

    function escapeHTML(value) {

        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }



    /* ============================================================
       FORMATAR HORÁRIO
    ============================================================ */

    function formatGuideTime(dateString) {

        if (!dateString) {
            return '';
        }

        const date =
            new Date(dateString);

        if (isNaN(date.getTime())) {
            return '';
        }

        return date.toLocaleTimeString(
            'pt-BR',
            {
                hour: '2-digit',
                minute: '2-digit',
                timeZone: 'America/Sao_Paulo'
            }
        );

    }



    /* ============================================================
       RENDERIZAR GUIA
    ============================================================ */

    function renderTVGuide(channel) {

        const guide =
            document.getElementById('tvGuide');

        const nowContainer =
            document.getElementById('tvGuideNow');

        const listContainer =
            document.getElementById('tvGuideList');


        if (
            !guide ||
            !nowContainer ||
            !listContainer
        ) {
            return;
        }


        const programs =
            Array.isArray(channel.now_playing_next_programmes)
                ? channel.now_playing_next_programmes
                : [];


        /*
         * Se o canal não possui guia
         */

        if (
            channel.now_playing_has_guide !== true &&
            programs.length === 0
        ) {

            guide.classList.add('hidden');

            return;

        }


        guide.classList.remove('hidden');



        /* ========================================================
           PROGRAMA ATUAL
        ======================================================== */

        const currentTitle =
            channel.now_playing_title ||
            'Programação atual';


        const progress =
            Math.max(
                0,
                Math.min(
                    100,
                    Number(channel.now_playing_progress) || 0
                )
            );


        nowContainer.innerHTML = `

            <div class="tv-guide-now">

                <div class="tv-guide-now-label">

                    <span class="tv-guide-live-dot"></span>

                    AO VIVO AGORA

                </div>


                <div class="tv-guide-current-name">

                    ${escapeHTML(currentTitle)}

                </div>


                <div class="tv-guide-current-time">

                    ${progress}% da programação atual

                </div>


                <div class="tv-guide-progress">

                    <div
                        class="tv-guide-progress-fill"
                        style="width:${progress}%"
                    ></div>

                </div>

            </div>

        `;



        /* ========================================================
           LISTA DE PROGRAMAS
        ======================================================== */

        if (programs.length === 0) {

            listContainer.innerHTML = `

                <div class="tv-guide-empty">

                    Nenhuma programação adicional disponível

                </div>

            `;

            return;

        }



        const now =
            new Date();



        listContainer.innerHTML =
            programs.map(program => {


                const start =
                    program.start
                        ? new Date(program.start)
                        : null;


                const end =
                    program.end
                        ? new Date(program.end)
                        : null;


                let active = false;


                /*
                 * Descobre se o programa está passando agora
                 */

                if (
                    start &&
                    end &&
                    !isNaN(start.getTime()) &&
                    !isNaN(end.getTime())
                ) {

                    active =
                        now >= start &&
                        now < end;

                }


                const startTime =
                    formatGuideTime(program.start);


                const endTime =
                    formatGuideTime(program.end);



                return `

                    <div
                        class="tv-guide-item ${active ? 'active' : ''}"
                    >

                        <div class="tv-guide-time">

                            ${startTime || '--:--'}

                        </div>


                        <div class="tv-guide-program">

                            <div class="tv-guide-program-name">

                                ${escapeHTML(
                                    program.title ||
                                    'Programação'
                                )}

                            </div>


                            ${
                                endTime
                                    ? `

                                        <div class="tv-guide-program-end">

                                            Até ${endTime}

                                        </div>

                                      `
                                    : ''
                            }

                        </div>

                    </div>

                `;

            }).join('');

    }



    /* ============================================================
       CARREGAR CONTEÚDO
    ============================================================ */

    async function loadContent() {

        try {

            const apiUrl =
                type === 'channel'
                    ? REI_API_CHANNELS
                    : REI_API_EVENTS;


            const response =
                await fetch(apiUrl);


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();



            if (
                data &&
                data.success &&
                Array.isArray(data.data)
            ) {

                const item =
                    data.data.find(
                        i =>
                            String(i.id) ===
                            String(id)
                    );


                if (item) {

                    renderPage(item);

                } else {

                    showError(
                        'Conteúdo não encontrado.'
                    );

                }

            } else {

                showError(
                    'Erro ao carregar dados da API.'
                );

            }

        } catch (error) {

            console.error(
                'Erro:',
                error
            );


            showError(
                'Erro de conexão com o servidor.'
            );

        }

    }



    /* ============================================================
       RENDERIZAR PÁGINA
    ============================================================ */

    function renderPage(item) {

        const title =
            item.title ||
            item.name ||
            'Canais Ao Vivo';



        /* ========================================================
           TÍTULO
        ======================================================== */

        document.getElementById(
            'tvTitle'
        ).textContent = title;


        document.getElementById(
            'itemName'
        ).textContent = title;


        document.getElementById(
            'itemCategory'
        ).textContent =
            item.category ||
            (
                type === 'channel'
                    ? 'Canal de TV'
                    : 'Evento Esportivo'
            );



        /* ========================================================
           INFO CARD
        ======================================================== */

        const infoCard =
            document.getElementById(
                'infoCard'
            );


        const posterImg =
            document
                .getElementById('itemPoster')
                .querySelector('img');


        posterImg.src =
            item.poster ||
            item.logo_url ||
            item.preview_url ||
            'https://placehold.co/600x400/111/FFF?text=Sem+Capa';


        posterImg.alt =
            title;


        infoCard.classList.remove(
            'hidden'
        );



        /* ========================================================
           DETALHES
        ======================================================== */

        const details =
            document.getElementById(
                'itemDetails'
            );


        let detailsHtml = '';



        if (type === 'event') {

            if (item.start_time) {

                detailsHtml += `

                    <div class="flex items-center gap-2">

                        <i class="far fa-clock"></i>

                        Início:
                        ${escapeHTML(item.start_time)}

                    </div>

                `;

            }


            if (item.status) {

                detailsHtml += `

                    <div class="flex items-center gap-2">

                        <i class="fas fa-info-circle"></i>

                        Status:

                        <span
                            class="${
                                item.status === 'live'
                                    ? 'text-green-500 font-bold'
                                    : ''
                            }"
                        >

                            ${
                                item.status === 'live'
                                    ? 'AO VIVO'
                                    : 'Em breve'
                            }

                        </span>

                    </div>

                `;

            }

        } else {

            detailsHtml += `

                <div class="flex items-center gap-2">

                    <i class="fas fa-tv"></i>

                    Transmissão 24 horas disponível

                </div>

            `;

        }


        details.innerHTML =
            detailsHtml;



        /* ========================================================
           GUIA DO CANAL
        ======================================================== */

        if (type === 'channel') {

            renderTVGuide(item);

        }



        /* ========================================================
           PLAYERS
        ======================================================== */

        const embeds =
            type === 'channel'
                ? [
                    {
                        embed_url:
                            item.embed_url,

                        player_name:
                            'Player Principal'
                    }
                ]
                : item.embeds;


        const selector =
            document.getElementById(
                'playerSelector'
            );


        const buttonsContainer =
            document.getElementById(
                'playerButtons'
            );



        if (
            embeds &&
            embeds.length > 0
        ) {

            selector.classList.remove(
                'hidden'
            );


            buttonsContainer.innerHTML =
                embeds
                    .filter(
                        emb =>
                            emb &&
                            emb.embed_url
                    )
                    .map(
                        (emb, idx) => `

                            <button
                                class="btn-player ${
                                    idx === 0
                                        ? 'active'
                                        : ''
                                } px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2"

                                onclick="switchPlayer(
                                    this,
                                    ${JSON.stringify(
                                        emb.embed_url
                                    )}
                                )"
                            >

                                <i class="fas fa-server"></i>

                                ${escapeHTML(
                                    emb.player_name ||
                                    'Player ' + (idx + 1)
                                )}

                            </button>

                        `
                    )
                    .join('');


            const firstEmbed =
                embeds.find(
                    emb =>
                        emb &&
                        emb.embed_url
                );


            if (firstEmbed) {

                switchPlayer(
                    null,
                    firstEmbed.embed_url,
                    true
                );

            } else {

                showError(
                    'Nenhum player disponível no momento.'
                );

            }

        } else {

            showError(
                'Nenhum player disponível no momento.'
            );

        }

    }



    /* ============================================================
       TROCAR PLAYER
    ============================================================ */

    function switchPlayer(
        btn,
        url,
        isFirst = false
    ) {

        const container =
            document.getElementById(
                'iframeContainer'
            );


        const loading =
            document.getElementById(
                'loading'
            );


        if (!url) {

            showError(
                'URL do player não encontrada.'
            );

            return;

        }



        if (!isFirst && btn) {

            document
                .querySelectorAll(
                    '.btn-player'
                )
                .forEach(
                    b =>
                        b.classList.remove(
                            'active'
                        )
                );


            btn.classList.add(
                'active'
            );

        }



        loading.classList.remove(
            'hidden'
        );


        container.classList.add(
            'hidden'
        );


        container.innerHTML = `

            <iframe
                src="${escapeHTML(url)}"
                allowfullscreen
                scrolling="no"
                allow="autoplay; encrypted-media"
            ></iframe>

        `;



        setTimeout(
            () => {

                container.classList.remove(
                    'hidden'
                );

                loading.classList.add(
                    'hidden'
                );

            },
            1500
        );

    }



    /* ============================================================
       ERRO
    ============================================================ */

    function showError(msg) {

        document.getElementById(
            'loading'
        ).innerHTML = `

            <div class="text-center px-4">

                <i
                    class="fas fa-exclamation-triangle text-red-500 text-3xl mb-4"
                ></i>


                <p
                    class="text-xs font-bold uppercase text-white/60"
                >
                    ${escapeHTML(msg)}
                </p>


                <a
                    href="javascript:history.back()"
                    class="mt-6 inline-block px-6 py-2 bg-white/10 rounded-full text-[10px] font-black uppercase tracking-widest hover:bg-lead transition-all"
                >
                    Voltar
                </a>

            </div>

        `;

    }



    /* ============================================================
       INICIAR
    ============================================================ */

    loadContent();

</script>

</body>
</html>
